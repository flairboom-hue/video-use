name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor is what pyproject declares; the ceiling catches breakage
        # from a new release before a user hits it.
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The suite is pure logic on purpose: no ffmpeg, no models, no network.
      # Only the optional OTIO extra is installed, so its adapter tests run
      # instead of skipping.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install "OpenTimelineIO-Plugins" || echo "OTIO unavailable; those tests will skip"

      - name: Run tests (video-use helpers)
        run: pytest -q

      - name: Run tests (ai-video-editor)
        working-directory: ai-video-editor
        run: |
          pip install pillow
          pytest -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install ruff
        run: pip install ruff
      - name: Check the helpers compile and are import-clean
        run: |
          ruff check helpers/ tests/ ai-video-editor/ --select E9,F63,F7,F82
          python -m compileall -q helpers/ tests/ ai-video-editor/engine ai-video-editor/backend
